apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rest-server
  template:
    metadata:
      labels:
        app: rest-server
    spec:
      containers:
        - name: rest-server
          image: lab7-rest:dev
          ports:
            - containerPort: 5000
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: S3_ENDPOINT
              value: "http://rustfs-svc.rustfs-ns.svc.cluster.local:9000"
            - name: S3_BUCKET
              value: "demucs-audio"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-client-credentials
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-client-credentials
                  key: secret-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
