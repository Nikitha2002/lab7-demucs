apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-server
spec:
  replicas: 1
  selector:
    matchLabels: {app: rest-server}
  template:
    metadata:
      labels: {app: rest-server}
    spec:
      containers:
      - name: rest-server
        image: REST_IMAGE_PLACEHOLDER
        ports: [{containerPort: 5000}]
        envFrom:
        - configMapRef: {name: lab7-settings}
        - secretRef: {name: rustfs-client-credentials}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}
        readinessProbe:
          httpGet: {path: /health, port: 5000}
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rest-service
spec:
  selector: {app: rest-server}
  ports: [{name: http, port: 5000, targetPort: 5000}]
