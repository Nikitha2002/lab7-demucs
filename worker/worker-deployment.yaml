apiVersion: apps/v1
kind: Deployment
metadata:
  name: demucs-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demucs-worker
  template:
    metadata:
      labels:
        app: demucs-worker
    spec:
      containers:
        - name: demucs-worker
          image: lab7-worker:cpu
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: S3_ENDPOINT
              value: "http://rustfs-svc.rustfs-ns.svc.cluster.local:9000"
            - name: S3_BUCKET
              value: "demucs-audio"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-client-credentials
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-client-credentials
                  key: secret-key
          resources:
            requests:
              cpu: "1000m"
              memory: "6Gi"
            limits:
              memory: "10Gi"
